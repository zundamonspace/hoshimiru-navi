name: YouTubeの最新動画を確認

on:
  schedule:
    - cron: "7 * * * *"   # 1時間ごと（新しい動画が出たときだけサイトを更新）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: YouTubeの最新動画を取得
        run: node scripts/fetch-youtube.mjs
      - name: 動画が変わっていればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/youtube.json
          git diff --cached --quiet || (git commit -m "YouTubeの最新動画を更新" && git pull --rebase && git push)
